[package]
name = "musicx"
version = "0.4.1"
description = "musicx (Hi-Fi local & network player)"
authors = ["musicx team"]
edition = "2021"

[lib]
name = "musicx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "gzip", "stream"] }
regex = "1"
url = "2"
tokio = { version = "1", features = ["full"] }

# Hi-Fi Audio playback & decoding
symphonia = { version = "0.5", features = ["all"] }
cpal = "0.15"
rustfft = "6.2"
rubato = "0.16"

# Database & fast multithreaded scanning
rusqlite = { version = "0.32", features = ["bundled", "bundled-full"] }
jwalk = "0.8"

# Fast Base64 encoding for embedded cover art
base64 = "0.22"

# Blocking HTTP client (TLS) used by the local radio relay (ICY metadata + byte counting)
ureq = { version = "2", features = ["tls"] }

# Linux D-Bus MPRIS Media Controls
[target.'cfg(target_os = "linux")'.dependencies]
mpris-player = "0.6"
glib = "0.15"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
